name: Release
# Push a tag such as v0.1.0 to build the macOS app, the Windows app, a wheel and an sdist,
# then attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[tiff]" pyinstaller
      - run: sh packaging/make_icns.sh
      - run: pyinstaller packaging/smneg.spec --noconfirm
      - name: Create disk image
        run: |
          mkdir -p dmg && cp -R dist/SMneg.app dmg/
          hdiutil create -volname SMneg -srcfolder dmg -ov -format UDZO SMneg-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: SMneg-macOS.dmg

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[tiff]" pyinstaller
      - run: pyinstaller packaging/smneg.spec --noconfirm
      - name: Zip the app
        run: Compress-Archive -Path dist/SMneg -DestinationPath SMneg-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: SMneg-Windows.zip

  publish:
    needs: [python-package, macos-app, windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## SMneg ${{ github.ref_name }}
            Film negative inversion for camera scanning. © 2026 Said Mrigua, Apache-2.0.

            - **macOS**: download `SMneg-macOS.dmg`. The app is not notarized: right-click the app and choose *Open* the first time.
            - **Windows**: download `SMneg-Windows.zip`, unzip, run `SMneg.exe` (SmartScreen may warn: *More info* then *Run anyway*).
            - **Python**: `pip install smneg-*.whl` (or the `.tar.gz`).
