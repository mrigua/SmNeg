name: Release
# Push a tag such as v0.1.0 to test the tagged revision, build the macOS (Apple Silicon) app, the Windows app,
# a wheel and an sdist, smoke-test the apps, then attach everything to a GitHub Release.
# Run it by hand (Actions tab -> Release -> Run workflow) to rehearse the build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    # nothing is built or published unless the tests pass on this exact revision
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[tiff,dev]"
      - run: python -m pyflakes src tests packaging
      - run: pytest -q
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(python -c "import smneg; print(smneg.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$VERSION"; exit 1; }

  python-package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  macos-app:
    needs: validate
    # macos-latest is an Apple Silicon (arm64) runner, so this app is arm64 only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[tiff]" pyinstaller
      - run: sh packaging/make_icns.sh
      - run: pyinstaller packaging/smneg.spec --noconfirm
      - name: Smoke test the built app (imports, assets, inversion, window)
        run: |
          file dist/SMneg.app/Contents/MacOS/SMneg
          QT_QPA_PLATFORM=offscreen dist/SMneg.app/Contents/MacOS/SMneg --self-test
      - name: Create disk image
        run: |
          mkdir -p dmg && cp -R dist/SMneg.app dmg/
          hdiutil create -volname SMneg -srcfolder dmg -ov -format UDZO SMneg-macOS-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: SMneg-macOS-arm64.dmg

  windows-app:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[tiff]" pyinstaller
      - run: pyinstaller packaging/smneg.spec --noconfirm
      - name: Smoke test the built app (imports, assets, inversion, window)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/SMneg/SMneg.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Zip the app
        run: Compress-Archive -Path dist/SMneg -DestinationPath SMneg-Windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: SMneg-Windows-x64.zip

  publish:
    needs: [python-package, macos-app, windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## SMneg ${{ github.ref_name }}
            Film negative inversion for camera scanning. © 2026 Said Mrigua, Apache-2.0.

            - **macOS (Apple Silicon, M1 or newer)**: download `SMneg-macOS-arm64.dmg`. Intel Macs: install from source (see the installation guide). The app is not notarized: right-click → *Open* (macOS 14 and older) or *System Settings → Privacy & Security → Open Anyway* (macOS 15+).
            - **Windows (64-bit)**: download `SMneg-Windows-x64.zip`, unzip, run `SMneg.exe` (SmartScreen may warn: *More info* then *Run anyway*).
            - **Python**: `pip install smneg-*.whl` (or the `.tar.gz`).

            The tests passed on macOS and Windows for this tag, and each app ran an automatic start-up self-test before publishing. The graphical interface has not been checked on real Windows hardware yet.

            Details: [installation guide](https://github.com/saidmrigua/SmNeg/blob/${{ github.ref_name }}/docs/installation.md) · [changelog](https://github.com/saidmrigua/SmNeg/blob/${{ github.ref_name }}/CHANGELOG.md) · third-party licenses: `THIRD_PARTY_LICENSES.md`.
